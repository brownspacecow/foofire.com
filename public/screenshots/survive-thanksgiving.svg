<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Survive Thanksgiving 2026 card art: a snowy Grandma's house, Dad's red car with a biscuit bag on the roof, Jira and Joel throwing snowballs at big cousin CJ, and a roast turkey on a platter">
  <defs>
    <linearGradient id="tgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79bbe4"/>
      <stop offset="0.62" stop-color="#cfe9f8"/>
      <stop offset="1" stop-color="#f2fbff"/>
    </linearGradient>
    <radialGradient id="tgSun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6cc" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff6cc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tgRoad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c5668"/>
      <stop offset="1" stop-color="#323b4c"/>
    </linearGradient>
    <linearGradient id="tgRibbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cf3a51"/>
      <stop offset="1" stop-color="#9c1f36"/>
    </linearGradient>
    <filter id="tgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="5" stdDeviation="0" flood-color="#241a2e"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#tgSky)"/>
  <circle cx="1000" cy="122" r="120" fill="url(#tgSun)"/>
  <circle cx="1000" cy="122" r="42" fill="#fff8dc" opacity="0.9"/>

