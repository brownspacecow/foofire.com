      <circle cx="667" cy="552" r="27" fill="#f4cfa8" stroke="#241a2e" stroke-width="5"/>
      <path d="M640 550 Q 667 516 694 550 L694 536 Q 667 508 640 536 Z" fill="#4a2f1d" stroke="#241a2e" stroke-width="4"/>
