<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A cosy underground dungeon with a glowing crystal heart, little imps digging for gold, a big veteran monster, and a knight peeking in">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241733"/>
      <stop offset="55%" stop-color="#1a1029"/>
      <stop offset="100%" stop-color="#0e0818"/>
    </linearGradient>
    <radialGradient id="cave" cx="50%" cy="55%" r="62%">
      <stop offset="0%" stop-color="#59406f"/>
      <stop offset="52%" stop-color="#3b2a4d"/>
      <stop offset="100%" stop-color="#241733"/>
    </radialGradient>
    <radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd0dc" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ff6b8b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff4f78" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f2c14e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a7458"/>
      <stop offset="100%" stop-color="#5f4a3c"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd7e0"/>
      <stop offset="45%" stop-color="#ff6b8b"/>
      <stop offset="100%" stop-color="#c9204f"/>
    </linearGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d4c36"/>
      <stop offset="100%" stop-color="#40291e"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="55%" stop-color="#07040d" stop-opacity="0"/>
      <stop offset="100%" stop-color="#07040d" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- dirt and rock around the cave -->
  <rect y="470" width="1200" height="205" fill="#1d1228"/>
  <path d="M0 120 L1200 96 L1200 30 L0 52 Z" fill="#2c1d3d"/>
  <path d="M0 560 C 180 520 300 585 470 556 C 660 522 820 582 1010 548 C 1090 534 1150 548 1200 536 L1200 675 L0 675 Z" fill="#251735"/>

  <!-- the cave -->
  <ellipse cx="600" cy="360" rx="520" ry="270" fill="url(#cave)"/>
  <ellipse cx="600" cy="576" rx="470" ry="86" fill="#4a3659"/>
  <ellipse cx="600" cy="560" rx="430" ry="62" fill="url(#floor)"/>

  <!-- rock texture speckles -->
  <g fill="#33234a" opacity="0.7">
    <circle cx="168" cy="214" r="16"/><circle cx="226" cy="178" r="9"/>
    <circle cx="976" cy="236" r="18"/><circle cx="1042" cy="286" r="10"/>
    <circle cx="118" cy="430" r="12"/><circle cx="1086" cy="438" r="14"/>
    <circle cx="414" cy="156" r="8"/><circle cx="768" cy="150" r="11"/>
  </g>
  <g fill="#2a1a3a" opacity="0.8">
    <path d="M120 300 q40 -46 88 -12 q22 46 -18 70 q-62 8 -70 -58 Z"/>
    <path d="M980 372 q46 -52 96 -16 q24 50 -22 76 q-66 6 -74 -60 Z"/>
  </g>

  <!-- gold seam on the left -->
  <g>
    <circle cx="252" cy="470" r="118" fill="url(#goldGlow)" opacity="0.35"/>
    <path d="M196 492 l24 -38 l30 20 l14 -30 l34 24 l20 -14 l12 46 l-30 22 l-42 4 l-38 -10 Z" fill="#c98b1e" opacity="0.5"/>
    <g fill="#ffd166">
      <circle cx="236" cy="470" r="16"/>
      <circle cx="266" cy="486" r="20"/>
      <circle cx="292" cy="462" r="13"/>
      <circle cx="250" cy="502" r="12"/>
      <circle cx="300" cy="492" r="9"/>
    </g>
    <g fill="#fff0b8">
      <circle cx="230" cy="464" r="6"/>
      <circle cx="262" cy="478" r="7"/>
      <circle cx="292" cy="457" r="4"/>
    </g>
  </g>

  <!-- Dungeon Heart -->
  <g>
    <circle cx="600" cy="382" r="176" fill="url(#heartGlow)"/>
    <ellipse cx="600" cy="512" rx="98" ry="26" fill="#1c1226" opacity="0.65"/>
    <path d="M540 500 h120 l-14 26 h-92 Z" fill="#6b5a8c"/>
    <rect x="552" y="470" width="96" height="30" rx="8" fill="#4a3d56"/>
    <path d="M600 300 L666 378 L636 490 L564 490 L534 378 Z" fill="url(#gem)" stroke="#ffd7e0" stroke-width="5" stroke-linejoin="round"/>
    <path d="M600 300 L600 490 L564 490 L534 378 Z" fill="#ff8fa3" opacity="0.55"/>
    <path d="M600 300 L666 378 L636 490 L600 490 Z" fill="#e33a63" opacity="0.5"/>
    <ellipse cx="588" cy="356" rx="20" ry="30" fill="#fff0f4" opacity="0.55"/>
    <ellipse cx="600" cy="382" rx="128" ry="24" fill="none" stroke="#ffd166" stroke-width="7" opacity="0.85"/>
    <ellipse cx="600" cy="382" rx="164" ry="32" fill="none" stroke="#ffd166" stroke-width="3" opacity="0.35"/>
  </g>

  <!-- a big veteran monster on the right, spikes and all -->
  <g transform="translate(956 462) scale(1.35)">
    <ellipse cx="0" cy="42" rx="34" ry="9" fill="#1b1122" opacity="0.5"/>
    <ellipse cx="0" cy="2" rx="30" ry="26" fill="#8bd46a"/>
    <ellipse cx="0" cy="10" rx="16" ry="12" fill="#5a9e43"/>
    <circle cx="-11" cy="-8" r="8" fill="#fff"/>
    <circle cx="11" cy="-8" r="8" fill="#fff"/>
    <circle cx="-10" cy="-7" r="4" fill="#241a2e"/>
    <circle cx="12" cy="-7" r="4" fill="#241a2e"/>
    <path d="M-20 -24 l-6 -14 l12 8 Z" fill="#5a9e43"/>
    <path d="M20 -24 l6 -14 l-12 8 Z" fill="#5a9e43"/>
    <path d="M-8 14 q8 8 16 0" stroke="#2f4d24" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="-30" cy="4" r="9" fill="#8bd46a"/>
    <circle cx="30" cy="4" r="9" fill="#8bd46a"/>
    <path d="M-34 -8 l-10 -18 l16 8 Z" fill="#b4adbd"/>
    <path d="M34 -8 l10 -18 l-16 8 Z" fill="#b4adbd"/>
  </g>

  <!-- imps -->
  <g transform="translate(418 468)">
    <ellipse cx="0" cy="38" rx="34" ry="10" fill="#1b1122" opacity="0.5"/>
    <path d="M-22 30 L0 -22 L22 30 Z" fill="#e0a86a"/>
    <circle cx="0" cy="-28" r="20" fill="#c98b4b"/>
    <circle cx="-8" cy="-32" r="6" fill="#fff"/>
    <circle cx="8" cy="-32" r="6" fill="#fff"/>
    <circle cx="-8" cy="-31" r="3" fill="#241a2e"/>
    <circle cx="8" cy="-31" r="3" fill="#241a2e"/>
    <path d="M-18 -38 l-10 -20 l16 12 Z" fill="#c98b4b"/>
    <path d="M18 -38 l10 -20 l-16 12 Z" fill="#c98b4b"/>
    <path d="M24 4 l26 -34" stroke="#9aa0b5" stroke-width="6" stroke-linecap="round"/>
    <path d="M42 -36 l18 8 l-8 16 l-16 -10 Z" fill="#b7b7c8"/>
  </g>
  <g transform="translate(300 520) scale(0.8)">
    <ellipse cx="0" cy="38" rx="34" ry="10" fill="#1b1122" opacity="0.5"/>
    <path d="M-22 30 L0 -22 L22 30 Z" fill="#e0a86a"/>
    <circle cx="0" cy="-28" r="20" fill="#c98b4b"/>
    <circle cx="-8" cy="-32" r="6" fill="#fff"/>
    <circle cx="8" cy="-32" r="6" fill="#fff"/>
    <circle cx="-8" cy="-31" r="3" fill="#241a2e"/>
    <circle cx="8" cy="-31" r="3" fill="#241a2e"/>
    <path d="M-18 -38 l-10 -20 l16 12 Z" fill="#c98b4b"/>
    <path d="M18 -38 l10 -20 l-16 12 Z" fill="#c98b4b"/>
    <circle cx="-24" cy="18" r="7" fill="#ffd166"/>
    <circle cx="-6" cy="24" r="6" fill="#ffd166"/>
  </g>

  <!-- a grumpy little monster friend near the heart -->
  <g transform="translate(686 494)">
    <ellipse cx="0" cy="34" rx="34" ry="9" fill="#1b1122" opacity="0.5"/>
    <ellipse cx="0" cy="2" rx="30" ry="26" fill="#8bd46a"/>
    <ellipse cx="0" cy="10" rx="16" ry="12" fill="#5a9e43"/>
    <circle cx="-11" cy="-8" r="8" fill="#fff"/>
    <circle cx="11" cy="-8" r="8" fill="#fff"/>
    <circle cx="-10" cy="-7" r="4" fill="#241a2e"/>
    <circle cx="12" cy="-7" r="4" fill="#241a2e"/>
    <path d="M-20 -24 l-6 -14 l12 8 Z" fill="#5a9e43"/>
    <path d="M20 -24 l6 -14 l-12 8 Z" fill="#5a9e43"/>
    <path d="M-8 14 q8 8 16 0" stroke="#2f4d24" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="-30" cy="4" r="9" fill="#8bd46a"/>
    <circle cx="30" cy="4" r="9" fill="#8bd46a"/>
  </g>

  <!-- tidy knight peeking in from the left -->
  <g transform="translate(150 470)">
    <ellipse cx="0" cy="58" rx="40" ry="11" fill="#1b1122" opacity="0.5"/>
    <rect x="-20" y="18" width="40" height="38" rx="8" fill="#8a8aa8"/>
    <rect x="-16" y="-8" width="32" height="34" rx="9" fill="#c9d6e6"/>
    <circle cx="0" cy="-20" r="17" fill="#f0c9a0"/>
    <path d="M-22 -28 q22 -30 44 0 l0 -10 q-22 -20 -44 0 Z" fill="#dfe7f2"/>
    <rect x="-12" y="-22" width="24" height="6" rx="3" fill="#7d8fa6"/>
    <rect x="20" y="6" width="9" height="52" rx="4" fill="#dfe7f2" transform="rotate(12 20 6)"/>
    <rect x="-34" y="14" width="12" height="32" rx="5" fill="#7d8fa6"/>
    <path d="M0 -46 q10 -14 20 0" stroke="#ffd166" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="40" cy="20" r="16" fill="#ffd166" opacity="0.22"/>
    <circle cx="40" cy="20" r="7" fill="#ffe6a8"/>
  </g>

  <!-- floating dust motes -->
  <g fill="#ffd166" opacity="0.6">
    <circle cx="372" cy="332" r="3"/><circle cx="820" cy="298" r="2.5"/>
    <circle cx="486" cy="224" r="2"/><circle cx="748" cy="560" r="2.5"/>
    <circle cx="884" cy="336" r="3"/><circle cx="532" cy="592" r="2"/>
  </g>

  <rect width="1200" height="675" fill="url(#vignette)"/>
</svg>
