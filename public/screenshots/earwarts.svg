<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A moonlit magical castle with glowing windows and floating music notes">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080617"/>
      <stop offset="55%" stop-color="#1a1038"/>
      <stop offset="100%" stop-color="#34204f"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4cf" stop-opacity=".9"/>
      <stop offset="55%" stop-color="#ffe6a6" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#ffe6a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#382a61"/>
      <stop offset="100%" stop-color="#160f2d"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1538"/>
      <stop offset="100%" stop-color="#0b071a"/>
    </linearGradient>
    <radialGradient id="window" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe7a5"/>
      <stop offset="70%" stop-color="#f5bd62"/>
      <stop offset="100%" stop-color="#c48332"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#sky)"/>

