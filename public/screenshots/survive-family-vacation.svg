<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Survive Family Vacation screenshot">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1f5c"/>
      <stop offset="0.55" stop-color="#b4546b"/>
      <stop offset="1" stop-color="#f2a35e"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3b52"/>
      <stop offset="1" stop-color="#241c31"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="500" cy="96" r="90" fill="url(#glow)"/>
  <circle cx="500" cy="96" r="34" fill="#ffe9a8"/>

  <!-- distant hills -->
  <path d="M0 232 L90 186 L168 226 L246 178 L330 228 L420 190 L520 232 L640 198 L640 360 L0 360 Z" fill="#2c2340"/>
  <path d="M0 260 L110 222 L210 258 L310 224 L430 262 L540 230 L640 258 L640 360 L0 360 Z" fill="#231b34"/>

  <!-- road -->
  <path d="M236 360 L300 244 L356 244 L424 360 Z" fill="url(#road)"/>
  <path d="M318 360 L328 244" stroke="#ffd34d" stroke-width="5" stroke-dasharray="18 20" opacity="0.75"/>

  <!-- tornado -->
  <g transform="translate(190 120)">
    <ellipse cx="0" cy="0" rx="74" ry="16" fill="#f6d9b0" opacity="0.28"/>
    <ellipse cx="4" cy="26" rx="56" ry="14" fill="#f6d9b0" opacity="0.3"/>
    <ellipse cx="12" cy="50" rx="38" ry="11" fill="#f6d9b0" opacity="0.34"/>
    <ellipse cx="20" cy="72" rx="22" ry="8" fill="#f6d9b0" opacity="0.4"/>
    <ellipse cx="26" cy="90" rx="10" ry="5" fill="#f6d9b0" opacity="0.45"/>
    <g fill="#fff8ec">
      <ellipse cx="-42" cy="-4" rx="12" ry="8" transform="rotate(-18 -42 -4)"/>
      <ellipse cx="54" cy="24" rx="10" ry="7" transform="rotate(12 54 24)"/>
      <ellipse cx="-26" cy="58" rx="9" ry="6" transform="rotate(-8 -26 58)"/>
    </g>
    <g fill="#d8494c">
      <circle cx="-42" cy="-11" r="3"/>
      <circle cx="54" cy="17" r="2.6"/>
      <circle cx="-26" cy="52" r="2.4"/>
    </g>
  </g>

  <!-- gas station -->
  <g transform="translate(392 178)">
    <rect x="0" y="34" width="152" height="62" rx="4" fill="#e6d7b8"/>
    <rect x="-6" y="26" width="164" height="14" rx="3" fill="#d8494c"/>
    <rect x="10" y="52" width="52" height="28" rx="3" fill="#9fdcff"/>
    <rect x="76" y="52" width="30" height="44" rx="3" fill="#8a5a3b"/>
    <rect x="16" y="0" width="10" height="28" fill="#b9c2cf"/>
    <rect x="126" y="0" width="10" height="28" fill="#b9c2cf"/>
    <rect x="-4" y="-24" width="160" height="26" rx="4" fill="#d8494c"/>
    <rect x="-4" y="-24" width="160" height="7" fill="#ffcf4d"/>
    <g transform="translate(34 -2)">
      <rect x="0" y="6" width="88" height="20" rx="4" fill="#fff6e0"/>
      <text x="44" y="21" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" font-weight="bold" fill="#d8494c">BUFFET</text>
    </g>
  </g>

  <!-- kids -->
  <g transform="translate(292 262)">
    <rect x="-18" y="-6" width="36" height="38" rx="12" fill="#3cc9c0"/>
    <circle cx="0" cy="-20" r="15" fill="#f2c49b"/>
    <path d="M-15 -24 a15 15 0 0 1 30 0 z" fill="#2a2231"/>
    <circle cx="-5" cy="-20" r="2.2" fill="#241a20"/>
    <circle cx="5" cy="-20" r="2.2" fill="#241a20"/>
    <rect x="14" y="-2" width="12" height="20" rx="4" fill="#7b5bd6"/>
    <rect x="-14" y="32" width="10" height="20" rx="3" fill="#2c3a63"/>
    <rect x="4" y="32" width="10" height="20" rx="3" fill="#2c3a63"/>
  </g>
  <g transform="translate(344 272)">
    <rect x="-16" y="-4" width="32" height="32" rx="11" fill="#ff8a3d"/>
    <circle cx="0" cy="-16" r="13" fill="#eab98e"/>
    <path d="M-13 -19 a13 13 0 0 1 26 0 z" fill="#4a2f1f"/>
    <circle cx="-4" cy="-16" r="2" fill="#241a20"/>
    <circle cx="4" cy="-16" r="2" fill="#241a20"/>
    <rect x="-13" y="26" width="9" height="16" rx="3" fill="#3a5f8a"/>
    <rect x="4" y="26" width="9" height="16" rx="3" fill="#3a5a8a"/>
  </g>

  <!-- foreground scrub -->
  <g fill="#1a1428">
    <circle cx="60" cy="330" r="34"/>
    <circle cx="112" cy="344" r="26"/>
    <circle cx="562" cy="334" r="38"/>
    <circle cx="510" cy="350" r="24"/>
  </g>

  <!-- title -->
  <g transform="translate(32 42)">
    <text font-family="Trebuchet MS, sans-serif" font-size="13" font-weight="bold" fill="#ffd34d" letter-spacing="3">A SUPERNATURAL ROAD TRIP</text>
    <text y="34" font-family="Trebuchet MS, sans-serif" font-size="34" font-weight="bold" fill="#fff6e0">SURVIVE</text>
    <text y="68" font-family="Trebuchet MS, sans-serif" font-size="34" font-weight="bold" fill="#ff8fb8">FAMILY</text>
    <text y="102" font-family="Trebuchet MS, sans-serif" font-size="34" font-weight="bold" fill="#fff6e0">VACATION</text>
  </g>
