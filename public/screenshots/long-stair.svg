<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="The Long Stair game screen: a lamplit map of a stone cellar beside a party panel tracking four heroes' health and stress">
  <defs>
