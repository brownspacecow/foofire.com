<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Aisle Rush 85, a neon 1980s supermarket game show: a chrome shopping cart full of groceries in a supermarket aisle, a giant pickle jar, a hidden cash tag and the game logo">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#330e58" />
      <stop offset="0.55" stop-color="#1a0729" />
      <stop offset="1" stop-color="#0b0314" />
    </linearGradient>
    <linearGradient id="cardSun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe97a" />
      <stop offset="0.45" stop-color="#ff9f00" />
      <stop offset="1" stop-color="#ff2e97" />
    </linearGradient>
    <linearGradient id="cardGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbd5" />
      <stop offset="0.5" stop-color="#ffd93d" />
      <stop offset="1" stop-color="#ffab00" />
    </linearGradient>
    <linearGradient id="cardChrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fcff" />
      <stop offset="0.42" stop-color="#a8bddb" />
      <stop offset="0.58" stop-color="#5d7192" />
      <stop offset="1" stop-color="#e8f4ff" />
    </linearGradient>
    <linearGradient id="cardFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12041f" stop-opacity="0.35" />
      <stop offset="1" stop-color="#12041f" stop-opacity="0.95" />
    </linearGradient>
    <radialGradient id="cardSpot" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#ff7ac0" stop-opacity="0.3" />
      <stop offset="1" stop-color="#ff2e97" stop-opacity="0" />
    </radialGradient>
    <pattern id="cardChecker" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#ffdcea" />
      <rect width="24" height="24" fill="#fff2e2" />
      <rect x="24" y="24" width="24" height="24" fill="#fff2e2" />
    </pattern>
    <filter id="cardGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#cardBg)" />
  <rect width="1200" height="675" fill="url(#cardSpot)" />

  <!-- neon sunburst -->
  <g opacity="0.5">
    <circle cx="600" cy="300" r="252" fill="url(#cardSun)" />
    <g fill="#1a0729" opacity="0.82">
      <rect x="342" y="244" width="516" height="12" />
      <rect x="356" y="282" width="488" height="14" />
      <rect x="380" y="326" width="440" height="17" />
      <rect x="412" y="376" width="376" height="20" />
      <rect x="452" y="430" width="296" height="24" />
    </g>
  </g>

  <!-- floor -->
  <path d="M0 400 H1200 V675 H0 Z" fill="url(#cardChecker)" opacity="0.17" />
  <path d="M0 400 H1200 V675 H0 Z" fill="url(#cardFloor)" />
  <g stroke="#2fe4ff" stroke-opacity="0.18" stroke-width="2">
    <path d="M600 400 V675" />
    <path d="M420 400 L260 675" />
    <path d="M780 400 L940 675" />
    <path d="M240 400 L-20 675" />
    <path d="M960 400 L1220 675" />
    <path d="M0 455 H1200" />
    <path d="M0 540 H1200" />
    <path d="M0 630 H1200" />
  </g>

  <!-- shelves -->
  <g>
    <rect x="52" y="300" width="206" height="228" rx="8" fill="#230c3a" stroke="#ff2e97" stroke-width="5" />
    <rect x="62" y="310" width="186" height="26" rx="3" fill="#ff2e97" opacity="0.72" />
    <text x="155" y="330" text-anchor="middle" font-family="Bungee, Arial Black, sans-serif" font-size="14" fill="#fff8e7">AISLE 3</text>
    <g>
      <rect x="70" y="350" width="34" height="46" rx="3" fill="#ffd93d" />
      <rect x="112" y="350" width="34" height="46" rx="3" fill="#7ac74f" />
      <rect x="154" y="350" width="34" height="46" rx="3" fill="#d72b2b" />
      <rect x="196" y="350" width="34" height="46" rx="3" fill="#4f9de8" />
      <rect x="70" y="408" width="34" height="46" rx="3" fill="#ff8ac0" />
      <rect x="112" y="408" width="34" height="46" rx="3" fill="#2fe4ff" />
      <rect x="154" y="408" width="34" height="46" rx="3" fill="#ffd93d" />
      <rect x="196" y="408" width="34" height="46" rx="3" fill="#ff8a00" />
      <rect x="70" y="466" width="34" height="46" rx="3" fill="#b983ff" />
      <rect x="112" y="466" width="34" height="46" rx="3" fill="#fff1c4" />
      <rect x="154" y="466" width="34" height="46" rx="3" fill="#8ef58a" />
      <rect x="196" y="466" width="34" height="46" rx="3" fill="#ffb2d2" />
    </g>
  </g>

  <g>
    <rect x="944" y="286" width="206" height="242" rx="8" fill="#230c3a" stroke="#2fe4ff" stroke-width="5" />
    <rect x="954" y="296" width="186" height="26" rx="3" fill="#2fe4ff" opacity="0.8" />
    <text x="1047" y="316" text-anchor="middle" font-family="Bungee, Arial Black, sans-serif" font-size="14" fill="#1b0829">AISLE 1</text>
    <g>
      <rect x="962" y="336" width="34" height="46" rx="3" fill="#fff6df" />
      <rect x="1004" y="336" width="34" height="46" rx="3" fill="#ffd35c" />
      <rect x="1046" y="336" width="34" height="46" rx="3" fill="#b9fff0" />
      <rect x="1088" y="336" width="34" height="46" rx="3" fill="#ff8ac0" />
      <rect x="962" y="394" width="34" height="46" rx="3" fill="#ffe1f0" />
      <rect x="1004" y="394" width="34" height="46" rx="3" fill="#8ef58a" />
      <rect x="1046" y="394" width="34" height="46" rx="3" fill="#fff1c4" />
      <rect x="1088" y="394" width="34" height="46" rx="3" fill="#7bd7ff" />
    </g>
  </g>

  <!-- giant pickle jar -->
  <g transform="translate(1015 470) rotate(4)">
    <ellipse cx="0" cy="70" rx="64" ry="14" fill="#0b0314" opacity="0.45" />
    <rect x="-52" y="-38" width="104" height="104" rx="18" fill="#7ac74f" stroke="#2f6b2f" stroke-width="5" />
    <rect x="-58" y="-58" width="116" height="28" rx="9" fill="url(#cardChrome)" stroke="#4d5a6b" stroke-width="3" />
    <rect x="-38" y="4" width="76" height="48" rx="6" fill="#fff8e7" />
    <text x="0" y="30" text-anchor="middle" font-family="Bungee, Arial Black, sans-serif" font-size="17" fill="#2f6b2f">PICKLES</text>
    <g fill="#4f9a2f">
      <ellipse cx="-24" cy="-20" rx="13" ry="20" transform="rotate(-20 -24 -20)" />
      <ellipse cx="10" cy="-24" rx="13" ry="20" transform="rotate(12 10 -24)" />
      <ellipse cx="32" cy="-14" rx="11" ry="18" transform="rotate(28 32 -14)" />
    </g>
    <g fill="#ffd93d">
      <path d="M-70 -46 l4 13 13 4 -13 4 -4 13 -4 -13 -13 -4 13 -4 z" />
      <path d="M66 -16 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z" />
    </g>
  </g>

  <!-- shopping cart -->
  <g transform="translate(432 398)">
    <ellipse cx="140" cy="196" rx="160" ry="24" fill="#0b0314" opacity="0.5" />

    <!-- groceries -->
    <g stroke="#0b0314" stroke-width="4">
      <rect x="96" y="34" width="86" height="66" rx="5" fill="#ff2e97" />
      <rect x="150" y="8" width="58" height="92" rx="5" fill="#ffd93d" />
      <rect x="56" y="50" width="50" height="50" rx="5" fill="#2fe4ff" />
      <rect x="196" y="46" width="44" height="54" rx="5" fill="#7ac74f" />
      <rect x="26" y="66" width="38" height="34" rx="5" fill="#b983ff" />
    </g>
    <g font-family="Bungee, Arial Black, sans-serif" text-anchor="middle" fill="#1b0829">
      <text x="139" y="76" font-size="13">BOOM</text>
      <text x="179" y="60" font-size="11" transform="rotate(90 179 60)">SUDS</text>
    </g>

    <!-- basket -->
    <path d="M4 96 H268 L238 188 H38 Z" fill="#230d3a" stroke="url(#cardChrome)" stroke-width="10" stroke-linejoin="round" />
    <g stroke="#9db4d6" stroke-width="2.5" opacity="0.7">
      <path d="M36 96 L50 188" />
      <path d="M78 96 L86 188" />
      <path d="M120 96 L122 188" />
      <path d="M162 96 L158 188" />
      <path d="M204 96 L194 188" />
      <path d="M246 96 L230 188" />
    </g>
    <path d="M4 96 H-28 Q-50 96 -50 70" fill="none" stroke="url(#cardChrome)" stroke-width="10" stroke-linecap="round" />
    <circle cx="62" cy="200" r="14" fill="#12041f" stroke="url(#cardChrome)" stroke-width="6" />
    <circle cx="210" cy="200" r="14" fill="#12041f" stroke="url(#cardChrome)" stroke-width="6" />
  </g>

  <!-- hidden cash -->
  <g transform="translate(884 522) rotate(7)">
    <rect x="-58" y="-30" width="116" height="60" rx="6" fill="#c9ffe0" stroke="#13835a" stroke-width="4" />
    <rect x="-47" y="-19" width="94" height="38" rx="3" fill="none" stroke="#13835a" stroke-width="2" />
    <text x="0" y="8" text-anchor="middle" font-family="Bungee, Arial Black, sans-serif" font-size="24" fill="#13835a">$500</text>
    <text x="0" y="-38" text-anchor="middle" font-family="Bungee, Arial Black, sans-serif" font-size="13" fill="#7dffb0">HIDDEN CASH</text>
  </g>

  <!-- price tags -->
  <g transform="translate(300 292) rotate(-6)">
    <rect width="140" height="38" rx="4" fill="url(#cardGold)" stroke="#1b0829" stroke-width="3" />
    <text x="70" y="26" text-anchor="middle" font-family="Bungee, Arial Black, sans-serif" font-size="16" fill="#1b0829">GIANT +$300</text>
  </g>

  <!-- logo -->
  <g filter="url(#cardGlow)">
    <text x="600" y="150" text-anchor="middle" font-family="Bungee, Arial Black, sans-serif" font-size="104" letter-spacing="2" fill="url(#cardGold)" stroke="#5a0f5c" stroke-width="10" paint-order="stroke">AISLE RUSH</text>
  </g>
  <g>
    <text x="1015" y="140" text-anchor="middle" font-family="Bungee, Arial Black, sans-serif" font-size="44" fill="#2fe4ff" stroke="#1b0829" stroke-width="5" paint-order="stroke" transform="rotate(8 1015 140)">'85</text>
    <text x="600" y="204" text-anchor="middle" font-family="Bungee, Arial Black, sans-serif" font-size="26" letter-spacing="8" fill="#fff8e7">THE SUPERMARKET GAME SHOW</text>
  </g>

  <!-- badge and chips -->
  <g transform="translate(42 36)">
    <rect width="248" height="30" rx="3" fill="#12041f" stroke="#ffd93d" stroke-width="2" />
    <text x="124" y="21" text-anchor="middle" font-family="Bungee, Arial Black, sans-serif" font-size="12" letter-spacing="2" fill="#ffd93d">FOOFIRE GAMES ORIGINAL</text>
  </g>

  <g transform="translate(0 604)">
    <rect x="252" y="0" width="696" height="42" rx="5" fill="#12041f" stroke="#ff2e97" stroke-width="2" opacity="0.94" />
    <g font-family="Bungee, Arial Black, sans-serif" font-size="14" fill="#fff8e7" text-anchor="middle">
      <text x="356" y="27">3 TEAMS</text>
      <text x="490" y="27">6 QUESTIONS</text>
      <text x="644" y="27">THE BIG SWEEP</text>
      <text x="810" y="27" fill="#ffd93d">$5,000 BONUS</text>
    </g>
    <g fill="#ff2e97">
      <circle cx="420" cy="21" r="3" />
      <circle cx="562" cy="21" r="3" />
      <circle cx="732" cy="21" r="3" />
    </g>
  </g>

  <g fill="#ffd93d">
    <path d="M172 150 l5 16 16 5 -16 5 -5 16 -5 -16 -16 -5 16 -5 z" opacity="0.9" />
    <path d="M1006 212 l3 10 10 3 -10 3 -3 10 -3 -10 -10 -3 10 -3 z" opacity="0.8" />
  </g>
  <g fill="#2fe4ff">
    <path d="M262 240 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z" opacity="0.8" />
    <path d="M1132 250 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z" opacity="0.7" />
  </g>

  <rect x="12" y="12" width="1176" height="651" rx="18" fill="none" stroke="#ffd93d" stroke-width="4" />
  <rect x="24" y="24" width="1152" height="627" rx="12" fill="none" stroke="#ff2e97" stroke-width="2" opacity="0.55" />
</svg>
