      <g fill="#ffd98a"><rect x="507" y="313" width="18" height="24"/><rect x="555" y="313" width="18" height="24"/><rect x="603" y="313" width="18" height="24"/></g>
      <g stroke="#21142b" stroke-width="2"><path d="M516 313v24M507 325h18M564 313v24M555 325h18M612 313v24M603 325h18"/></g>
