      <rect x="164" y="278" width="9" height="11"/><rect x="200" y="276" width="9" height="11"/>
      <rect x="348" y="266" width="9" height="11"/><rect x="392" y="268" width="9" height="11"/>
      <rect x="520" y="274" width="9" height="11"/><rect x="572" y="272" width="9" height="11"/>
    </g>
