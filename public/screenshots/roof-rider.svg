      <g transform="translate(-58 44)">
        <circle r="31" fill="#120a1c"/>
        <circle r="26" fill="none" stroke="#a9b4c1" stroke-width="3"/>
        <g stroke="#a9b4c1" stroke-width="2">
          <path d="M0-22V22M-22 0H22M-15-15L15 15M15-15L-15 15"/>
        </g>
        <circle r="3" fill="#fff8e7"/>
      </g>

      <g transform="translate(68 38)">
        <circle r="31" fill="#120a1c"/>
        <circle r="26" fill="none" stroke="#a9b4c1" stroke-width="3"/>
        <g stroke="#a9b4c1" stroke-width="2">
          <path d="M0-22V22M-22 0H22M-15-15L15 15M15-15L-15 15"/>
        </g>
        <circle r="3" fill="#fff8e7"/>
