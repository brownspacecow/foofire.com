      <path d="M0 286v-48h22l16-24 16 24h28v48z"/>
      <path d="M92 286v-34h34l18-28 18 28h32v34z"/>
      <path d="M214 286v-52h30l17-26 17 26h32v52z"/>
      <path d="M340 286v-38h26l16-24 16 24h34v38z"/>
