    <g font-family="'Press Start 2P', 'Courier New', monospace">
      <text x="32" y="58" fill="#fff8e7" font-size="26" letter-spacing="2">ROOF</text>
      <text x="32" y="88" fill="#ffd93d" font-size="26" letter-spacing="2">RIDER</text>
      <text x="34" y="112" fill="#ffd9e2" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="3">ROOFTOP RHYTHM RACING</text>
    </g>

    <g font-family="Inter, system-ui, sans-serif" font-weight="900" fill="#fff8e7" font-size="11">
      <text x="456" y="352" font-size="10" letter-spacing="1" opacity="0.8">PRELOAD · POP · SCRUB</text>
    </g>
  </g>

  <rect x="1" y="1" width="638" height="358" fill="none" stroke="#120a1c" stroke-width="2" opacity="0.35"/>
</svg>
