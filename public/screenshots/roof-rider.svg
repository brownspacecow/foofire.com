      <circle cx="244" cy="30" r="1.4"/><circle cx="318" cy="54" r="1"/>
      <circle cx="398" cy="28" r="1.6"/><circle cx="454" cy="66" r="1.1"/>
      <circle cx="560" cy="38" r="1.4"/><circle cx="604" cy="72" r="1"/>
      <circle cx="212" cy="96" r="1.2"/><circle cx="350" cy="86" r="1.3"/>
      <circle cx="512" cy="112" r="1"/>
    </g>

    <circle cx="486" cy="84" r="108" fill="url(#moonGlow)"/>
    <circle cx="486" cy="84" r="34" fill="#ffe6ad"/>
    <g fill="#c8a78b" opacity="0.25">
