      <rect x="56" y="252" width="4" height="28" fill="#6e4050" opacity="0.6"/>
      <rect x="592" y="252" width="17" height="34" fill="#341d30"/>
      <rect x="588" y="248" width="25" height="7" fill="#563044"/>

