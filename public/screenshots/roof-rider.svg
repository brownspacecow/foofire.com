<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Roof Rider: a dirt bike jumping between the rooftops of a neighborhood at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241743"/>
      <stop offset="0.42" stop-color="#703c78"/>
      <stop offset="0.74" stop-color="#d45d72"/>
      <stop offset="1" stop-color="#ffb26b"/>
    </linearGradient>
    <linearGradient id="roofLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d47a4f"/>
      <stop offset="0.3" stop-color="#a74d34"/>
      <stop offset="1" stop-color="#5d2a22"/>
    </linearGradient>
    <linearGradient id="roofMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8d9c"/>
      <stop offset="0.35" stop-color="#566576"/>
      <stop offset="1" stop-color="#2d3542"/>
    </linearGradient>
    <linearGradient id="roofRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b96b48"/>
      <stop offset="0.35" stop-color="#8c452f"/>
      <stop offset="1" stop-color="#4c231f"/>
    </linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f4a52"/>
      <stop offset="1" stop-color="#3b2230"/>
    </linearGradient>
    <linearGradient id="wallM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#916055"/>
      <stop offset="1" stop-color="#43262c"/>
    </linearGradient>
    <linearGradient id="wallR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#684052"/>
      <stop offset="1" stop-color="#301b2c"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3cc" stop-opacity="0.65"/>
      <stop offset="0.35" stop-color="#ffe0a3" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffe0a3" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="640" height="360"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
