      <path d="M-20 8L-58 44" stroke="#a9b4c1" stroke-width="6" stroke-linecap="round"/>
      <path d="M46 -2L68 38" stroke="#d9d2c4" stroke-width="7" stroke-linecap="round"/>

      <path d="M-40 10L8 30 42 20 34 -10 -6 -20 -36 -14Z" fill="#ff2e63"/>
      <path d="M-6 32Q24 48 42 32L38 16 -2 22Z" fill="#ff2e63"/>
      <path d="M-64 32Q-26 42 0 30L-16 18 -60 24Z" fill="#17121f"/>
      <path d="M-24 -20L14 -10 22 -26 -18 -30Z" fill="#17121f"/>

      <path d="M42 34L64 38 66 16 44 12Z" fill="#fff8e7" stroke="#120a1c" stroke-width="2"/>
      <path d="M46 12Q80 18 98 2" stroke="#ff2e63" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M30 44L52 50" stroke="#a9b4c1" stroke-width="4" stroke-linecap="round"/>
      <path d="M0 -14Q-32 -8 -62 8" stroke="#8a7a6c" stroke-width="5" fill="none" stroke-linecap="round"/>

      <g>
        <path d="M-12 34Q2 18 -2 2" stroke="#1d1a2c" stroke-width="12" stroke-linecap="round" fill="none"/>
        <path d="M4 32Q16 18 12 4" stroke="#3d3355" stroke-width="10" stroke-linecap="round" fill="none"/>
        <path d="M-2 28Q22 22 36 4" stroke="#ff2e63" stroke-width="12" stroke-linecap="round" fill="none"/>
        <path d="M2 8Q22 -2 30 6" stroke="#ff2e63" stroke-width="10" stroke-linecap="round" fill="none"/>
        <circle cx="34" cy="-16" r="14" fill="#ffd93d" stroke="#120a1c" stroke-width="2"/>
        <path d="M40 -16L56 -12 38 -4Z" fill="#120a1c"/>
        <ellipse cx="44" cy="-14" rx="6" ry="3" fill="#2ec4ff"/>
        <path d="M4 30L-4 38M18 28L12 38" stroke="#120a1c" stroke-width="8" stroke-linecap="round"/>
